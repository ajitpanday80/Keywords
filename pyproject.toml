[project]
name = "kwintent"
version = "0.1.0"
description = "Intent-based keyword research for SEO and GEO, estimated entirely by Claude"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "pydantic>=2", "click>=8"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kwintent = "kwintent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kwintent"]
